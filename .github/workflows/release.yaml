name: Release charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Release to the Helm repository
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        if: steps.cr.outputs.changed_charts != ''
        env:
          CHANGED: ${{ steps.cr.outputs.changed_charts }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          mkdir -p .cr-oci
          for chart in ${CHANGED//,/ }; do
            helm package "$chart" --destination .cr-oci
          done
          for package in .cr-oci/*.tgz; do
            helm push "$package" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
