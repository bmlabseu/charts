# Default values for the classicpress chart.

replicaCount: 1

image:
  repository: docker.io/classicpress/classicpress
  # Upstream publishes rolling PHP-variant tags; the ClassicPress version they
  # contain is tracked by this chart's appVersion. Set digest to pin exactly.
  tag: php8.3-apache
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

classicpress:
  tablePrefix: cp_
  debug: false
  # PHP appended to wp-config.php, e.g. define('WP_MEMORY_LIMIT', '256M');
  configExtra: ""
  # Secret holding AUTH_KEY, SECURE_AUTH_KEY, LOGGED_IN_KEY, NONCE_KEY,
  # AUTH_SALT, SECURE_AUTH_SALT, LOGGED_IN_SALT, NONCE_SALT.
  # Generated and kept stable across upgrades when empty.
  existingSecret: ""

database:
  # Leave empty to use the bundled MariaDB.
  host: ""
  port: 3306
  name: classicpress
  user: classicpress
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  charset: utf8mb4
  collate: ""

mariadb:
  enabled: true
  image:
    repository: docker.io/mariadb
    tag: "11.8.9"
    digest: ""
    pullPolicy: IfNotPresent
  rootPassword: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    fsGroup: 999
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  existingClaim: ""
  # Subdirectory of the volume to serve from.
  subPath: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: classicpress.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Apache starts as root and drops to www-data, so a non-root default is not
# possible with the upstream image.
podSecurityContext:
  fsGroup: 33
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

livenessProbe:
  httpGet:
    path: /wp-login.php
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /wp-login.php
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  httpGet:
    path: /wp-login.php
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# Recreate is required while persistence uses a ReadWriteOnce volume.
updateStrategy:
  type: Recreate

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []

podAnnotations: {}
podLabels: {}
commonLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
