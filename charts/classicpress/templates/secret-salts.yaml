{{- if not .Values.classicpress.existingSecret }}
{{- $name := printf "%s-salts" (include "classicpress.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "classicpress.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
  {{ $key }}: {{ include "classicpress.retainedValue" (dict "secret" $existing "key" $key "default" (randAlphaNum 64)) }}
  {{- end }}
{{- end }}
