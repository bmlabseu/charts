{{- if .Values.mariadb.enabled }}
{{- $name := include "classicpress.mariadb.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "classicpress.mariadb.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ include "classicpress.retainedValue" (dict "secret" $existing "key" "root-password" "default" (default (randAlphaNum 24) .Values.mariadb.rootPassword)) }}
{{- end }}
