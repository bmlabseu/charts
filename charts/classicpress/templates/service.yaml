apiVersion: v1
kind: Service
metadata:
  name: {{ include "classicpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "classicpress.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "classicpress.selectorLabels" . | nindent 4 }}
