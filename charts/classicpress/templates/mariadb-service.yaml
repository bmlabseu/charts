{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "classicpress.mariadb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "classicpress.mariadb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "classicpress.mariadb.selectorLabels" . | nindent 4 }}
{{- end }}
